    <!-- Mã Xác Minh Google Search Console (Google Site Verification) -->
    <meta name="google-site-verification" id="google-site-verification-meta" content="" />

    <!-- Immediate bootstrap for Google Search Console & GA4 from localStorage -->
    <script>
      (function() {
        try {
          var savedGsc = localStorage.getItem('solutionbao_gsc_verification');
          if (savedGsc) {
            var cleanGsc = savedGsc.indexOf('content=') > -1 
              ? (savedGsc.match(/content=["']([^"']+)["']/i) || [null, savedGsc])[1]
              : savedGsc.replace(/<[^>]+>/g, '').trim();
            var meta = document.getElementById('google-site-verification-meta');
            if (meta) meta.setAttribute('content', cleanGsc);
          }
          var savedGa = localStorage.getItem('solutionbao_ga4_id');
          if (savedGa && savedGa.trim().indexOf('G-') === 0) {
            var gaId = savedGa.trim();
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(gaId);
            document.head.appendChild(s);
            window.dataLayer = window.dataLayer || [];
            function gtag(){ dataLayer.push(arguments); }
            window.gtag = gtag;
            gtag('js', new Date());
            gtag('config', gaId, { send_page_view: true });
          }
        } catch (e) {}
      })();
    </script>
